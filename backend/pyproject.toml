[project]
name = "eidolon-backend"
version = "0.1.0"
description = "Local-first, self-extending Eidolon personal agent backend."
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "jsonschema>=4.23.0",
    "mcp>=1.26.0,<2",
    "packaging>=24.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.30",
    "tomlkit>=0.13.2,<1",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.15.21",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "docker*", "tests*"]
