                  - paragraph [ref=f1e1072]: "Outcome: a short private, source-backed distinction between hard deadlines, nominal schedules, and adjustable plans before next week's application sprint. Evidence: current Notion list read October 22: MAT344 PS4 and requested MAT436 Week7 target Oct25; MAT436 essay1 Oct16 and Week6 Oct18 remain unchecked (not proof unsubmitted); POL107 podcast and oral-defense signup Oct30; 16 grad application tasks Oct26–Nov1, personal submission target Oct31. Quant scope target Oct18 says start after application sprint, but calendar still has Sat Oct24 and Tue Oct27 blocks and baseline task Oct25. CSC413 H3–H6 nominal dates have no late penalty, Dec9 cutoff, per existing source notes. Crucial new source: knowledge/quercus/MAT436H1 F LEC0101 - MAT436H1 F LEC0101 20269-Introduction to Linear Operators/files/processed/CourseIntro2026MAT436MAT1011Confirmed.md explicitly confirms Sept18 policy: exercises due Mondays from Sept21; essays Oct16/Dec11; no late penalty for homework submitted on/before Dec21. Existing Sunday homework times were user-requested schedules, not necessarily official deadlines. Next: reread current Notion tasks and matching processed course materials first; inspect current announcements/source pages as needed, including MAT344 PS4 actual due date, MAT436 policy changes and POL107 signup availability/deadline. Do not read student's submitted POL107 bibliography unless needed for an authorized source-search task; course AI policy permits only basic grammar correction and relevant source search, not drafting or analysis of assessed content. Save a small dated evidence/uncertainty table privately (workspace or these notes), not a full report. Assess latest schedule and whether quant prerequisite is still unmet; never infer noncompletion from unchecked rows. Mail sources remain unavailable/unknown (Gmail invalid_input, Outlook unavailable), not evidence no obligations. No source/todo/calendar edits, graded work, submission