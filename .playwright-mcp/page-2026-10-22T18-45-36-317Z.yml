                  - paragraph [ref=f1e171]: "Plan the day's Assistant responsibilities thoroughly. Planning produces agenda items; actual work runs in their later agenda activations. Do not carry out research projects, prepare deliverables, change user todos or other source records, or send a routine morning briefing during this planning task. Read enough authoritative detail to plan accurately; put deeper investigation and execution on the agenda, including work ready to start now. 1. Call assistant.changes.list and follow every page. Read the full active agenda and the whole question list, including answered/dismissed questions, with pagination. Consult current Atlas circumstances, goals, projects, interests and experiences, relevant commitments/todos, recent daily summaries, and pending actions as needed. Inspect existing understanding as well as changes. Failed sources are unknown, not evidence that nothing needs attention. 2. Consider all relevant areas: today's and upcoming commitments and deadlines; goals, projects and obstacles; learning/work and practical responsibilities; wellbeing and recovery; relationships and family; interests, enjoyment and meaningful experiences; financial/administrative needs; unresolved questions, decisions, promises and results awaiting follow-through. These are lenses, not mandatory tasks or permission to infer sensitive facts. Weigh importance, urgency, opportunity, effort, attention and dependencies. Do not stop after the first urgent academic/productivity item. 3. Think forward around each significant event: useful preparation before it, support at the right moment, and personal interest or outcome follow-up afterward. For an exam today, normally schedule a temporal question asking how it went after the known end plus breathing room. Use source evidence for timing; if the end is unknown, choose a clearly later considerate time and record that uncertainty. Do not ask before the event or assume its outcome. A busy day is a reason to choose a better time, not abandon follow-through. 4. Create or meaningfully revise concrete, independently actionable agenda tasks and questions for the useful next steps you identify. There should normally be several when circumstances warrant them. At least one separate responsibility must be saved with a due_at, or a waiting dependency and explicit next step, before this planning task is complete. Reuse existing responsibilities and answers rather than duplicates. Each item's notes state outcome, evidence/source, next step, timing reason, dependencies and authority limits. Research, preparation, solving problems and communicating results belong in those task activations. Do not mark planned work done. Preserve completed/dismissed agenda history; do not delete it to tidy the list. 5. Ensure at least one meaningful user-visible Assistant interaction each local calendar day while proactive mode is enabled. Check current.daily_interaction. If not yet satisfied, ensure a concrete question or communication responsibility is scheduled today at a suitable time; the daily check-in task is a fallback, not a substitute for timely personal follow-up. A waiting unanswered question does not prohibit a different relevant interaction. No reply is required to satisfy this output requirement; never treat silence as consent. Do not manufacture filler or interrupt quiet hours merely to increase activity. 6. Before finishing, reread the saved agenda and verify coverage, concrete next steps, due times and dependencies. Check that important events have appropriate follow-through and that useful authorized work will actually be activated. Return an empty final response after saving the plan; agenda items are the result of planning."
