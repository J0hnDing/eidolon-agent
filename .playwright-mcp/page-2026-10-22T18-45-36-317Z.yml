                  - paragraph [ref=f1e1086]: "Ensure today's required meaningful Assistant interaction. Read current.daily_interaction and the current agenda/context. If already satisfied today, finish silently. Otherwise communicate now through a useful agenda question (assistant.question.ask) or one brief, natural final message grounded in the user's current life: personal follow-up, a relevant question, or a useful result. Create/reuse the question first and respect its timing and receipt. Do not repeat an unanswered question or ask about an event before it ends. An unanswered question does not prohibit another relevant interaction. Do not send a generic quota announcement or demand a reply. An empty response without another user-visible interaction today does not complete this task and will be retried. Follow explicit user requests about quiet hours or no contact; record a conflicting instruction as a blocker rather than invent consent."
