<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Notes</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <header><span class="eyebrow">LOCAL NOTEBOOK</span><h1>Simple Notes</h1><p>Capture a thought. Keep it here.</p></header>
    <section class="composer" aria-labelledby="new-note-title">
      <h2 id="new-note-title">New note</h2>
      <textarea id="content" maxlength="10000" placeholder="What’s on your mind?" aria-describedby="feedback"></textarea>
      <div class="composer-footer"><span id="counter">0 / 10,000</span><button id="save">Save note</button></div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="notes-title"><div class="section-title"><h2 id="notes-title">Your notes</h2><span id="count"></span></div><div id="notes" aria-live="polite"><div class="state">Loading your notes…</div></div></section>
  </main>
  <template id="note-template"><article class="note"><div class="note-top"><time></time><button class="delete" aria-label="Delete note">Delete</button></div><p></p></article></template>
  <script src="/app.js" defer></script>
</body>
</html>
