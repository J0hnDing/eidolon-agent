<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Notes</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">LOCAL NOTES</p><h1>Simple Notes</h1><p>Small thoughts, saved on this device.</p></header>
    <form id="note-form">
      <label for="content">New note</label>
      <textarea id="content" maxlength="10000" rows="5" placeholder="Write something worth keeping…" required></textarea>
      <div class="form-row"><span id="message" role="status"></span><button type="submit">Save note</button></div>
    </form>
    <section aria-labelledby="notes-heading"><h2 id="notes-heading">Saved notes</h2><div id="notes" class="notes"></div></section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
